# Self-hosted deployment, and the fastest way to get a real Postgres to run
# the migrations and verification scripts against.
#
#   docker compose -f apps/server/docker-compose.yml up --build
#
# The database starts EMPTY on purpose. Nothing is mounted into
# /docker-entrypoint-initdb.d: the migration runner owns schema creation, and
# a schema applied at first boot would be invisible to it -- the runner would
# find no schema_migrations table, try to apply 0001 over existing objects,
# and fail. One thing creates the schema, and it is:
#
#   DATABASE_URL=postgresql://accounting:accounting@localhost:5432/accounting \
#     npm run db:apply

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
      POSTGRES_DB: accounting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The whole db/ directory, so the migrations, roles.sql and the verify
      # scripts can be run on demand from inside the container. Deliberately
      # NOT mounted into /docker-entrypoint-initdb.d -- see the note above.
      - ../../db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      ACCOUNTING_DEPLOYMENT_MODE: server
      ACCOUNTING_DATABASE_URL: postgresql://accounting:accounting@db:5432/accounting
      # Generated text-to-SQL runs as this role, not as the app role.
      # Create it with db/roles.sql, then uncomment:
      # ACCOUNTING_NL_QUERY_DATABASE_URL: postgresql://nl_query:CHANGEME@db:5432/accounting
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
