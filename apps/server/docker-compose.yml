# Self-hosted deployment, and the fastest way to get a real Postgres to run
# db/schema.sql and db/verify_schema.sql against.
#
#   docker compose -f apps/server/docker-compose.yml up --build
#
# Postgres applies everything in /docker-entrypoint-initdb.d on first boot of
# an empty volume, in filename order -- so the schema lands before the API
# starts taking requests.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
      POSTGRES_DB: accounting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied automatically on first boot of an empty volume.
      - ../../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # The whole db/ directory, so verify_schema.sql and roles.sql can be run
      # on demand. Mounted outside initdb.d so they do NOT run at boot.
      - ../../db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      ACCOUNTING_DEPLOYMENT_MODE: server
      ACCOUNTING_DATABASE_URL: postgresql://accounting:accounting@db:5432/accounting
      # Generated text-to-SQL runs as this role, not as the app role.
      # Create it with db/roles.sql, then uncomment:
      # ACCOUNTING_NL_QUERY_DATABASE_URL: postgresql://nl_query:CHANGEME@db:5432/accounting
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
