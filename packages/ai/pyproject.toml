[project]
name = "accounting-ai"
version = "0.1.0"
description = "Provider-agnostic AI layer (LiteLLM). The only place an LLM SDK may be imported."
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.55",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accounting_ai"]
